name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q godot_dev_mcp tests
      - run: python -m build

  godot-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2.4.2
        with:
          version: 4.7.1
          use-dotnet: true
      - run: |
          timeout 30s godot --headless --editor --path . --quit-after 3
