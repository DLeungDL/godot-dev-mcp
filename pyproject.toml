[project]
name = "grand-sire-dev-mcp"
version = "0.1.0"
description = "A small, dependency-free MCP gateway for Grand Sire Godot development"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
grand-sire-dev-mcp = "gs_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gs_mcp*"]

