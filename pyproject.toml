[project]
name = "godot-dev-mcp"
version = "0.2.0"
description = "A safe MCP gateway for Godot authoring, observation, and verification"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
godot-dev-mcp = "godot_dev_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["godot_dev_mcp*"]

